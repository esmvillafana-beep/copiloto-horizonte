name: Validacion del prototipo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: python scripts/run_tests.py
      - run: python scripts/evaluate.py
      - run: python scripts/configure.py
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: python scripts/verify_docker.py
      - if: always()
        run: docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-validacion
          path: evidence/generated/
